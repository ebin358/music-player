name: Mac app

# Builds the macOS app (desktop/) with its Rust engine, runs its self-test on
# the runner, and publishes a .dmg on the "mac-latest" release.
#
# Every run, pass or fail, also force-pushes its logs to the `ci-log` branch
# (status.txt, build.log, selftest.log), so the build can be followed with
# nothing more than git.
on:
  push:
    branches: [macos]
    paths:
      - 'desktop/**'
      - 'native/**'
      - 'innertube/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Rust engine
        id: native
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --release --manifest-path native/Cargo.toml 2>&1 | tee native.log
          cp native/target/release/libsquarecore.dylib desktop/resources/macos-arm64/

      - name: App
        id: app
        if: steps.native.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew -p desktop packageDmg --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Self-test
        id: selftest
        if: steps.app.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          APP=$(find desktop/build/compose/binaries -name 'Square.app' -maxdepth 4 | head -1)
          echo "app: $APP"
          "$APP/Contents/MacOS/Square" --selftest 2>&1 | tee selftest.log

      - name: Publish the .dmg
        id: publish
        if: steps.app.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(find desktop/build/compose/binaries -name '*.dmg' | head -1)
          cp "$DMG" Square-mac-arm64.dmg
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest Square-mac-arm64.dmg \
            --prerelease --target "$GITHUB_SHA" \
            --title "Square for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on the macos branch. Apple Silicon. Self-test: ${{ steps.selftest.outcome }}. Unsigned: right-click the app and choose Open the first time."

      - uses: actions/upload-artifact@v4
        if: steps.app.outcome == 'success'
        with:
          name: Square-mac-arm64-${{ github.sha }}
          path: Square-mac-arm64.dmg
          if-no-files-found: ignore

      - name: Report to the ci-log branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir report && cd report
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "native: ${{ steps.native.outcome }}"
            echo "app: ${{ steps.app.outcome }}"
            echo "selftest: ${{ steps.selftest.outcome }}"
            echo "publish: ${{ steps.publish.outcome }}"
          } > status.txt
          for f in native build selftest; do
            [ -f "../$f.log" ] || continue
            # Errors first, then the end of the log.
            { echo "=== errors ==="; grep -nE '^e: |^w: .*deprecated.*error|error(\[E[0-9]+\])?:|What went wrong|FAILURE|Could not|Exception|FAIL ' "../$f.log" | head -300
              echo; echo "=== tail ==="; tail -n 250 "../$f.log"; } > "$f.log"
          done
          git init -q -b ci-log
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "ci: ${GITHUB_SHA::7} native=${{ steps.native.outcome }} app=${{ steps.app.outcome }} selftest=${{ steps.selftest.outcome }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log

      - name: Fail the run when a step failed
        if: steps.native.outcome != 'success' || steps.app.outcome != 'success' || steps.selftest.outcome != 'success'
        run: exit 1
